Name: derivaciones.rpc
# Escucha solo en loopback: CrearDerivacion valida el rol pero no valida
# area_actual (esa validación vive en el Gateway, componiendo GetExpediente
# — ver docs/etapa-1.1-cierre-seguridad.md, punto 2). Mientras esa
# validación no viva en este propio servicio, no debe ser alcanzable desde
# fuera de esta máquina (Gateway, el único llamador legítimo, ya se conecta
# vía 127.0.0.1 — ver gateway/etc/gateway-api.yaml DerivacionesRpc.Target).
ListenOn: 127.0.0.1:8085
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: derivaciones.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: derivaciones_user
  Password: ${DERIVACIONES_DB_PASSWORD}
  Database: derivaciones_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

ExpedientesRpc:
  Target: 127.0.0.1:8082

# A + B: AplicarMovimiento (solo el publicador de Expedientes, token de
# servicio con audiencia derivaciones). Secreto EXCLUSIVO de esta audiencia,
# solo en backend/.env (nunca aquí). Vacío = AplicarMovimiento deshabilitado.
ServiceJWTSecret: "${SERVICE_JWT_SECRET_DERIVACIONES}"
ServiceTokenIssuer: tungasuca-auth
ServiceTokenAudience: derivaciones

# Conexión del consumidor: rol derivaciones_proyector (solo INSERT/SELECT en
# movimientos_proyeccion). Contraseña solo en backend/.env.
Proyector:
  Host: 127.0.0.1
  Port: 5433
  User: derivaciones_proyector
  Password: "${DERIVACIONES_PROYECTOR_DB_PASSWORD}"
  Database: derivaciones_db
  SSLMode: disable

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /derivaciones.Derivaciones/CrearDerivacion
      - /derivaciones.Derivaciones/GetDerivacion
      - /derivaciones.Derivaciones/ListDerivaciones
      - /derivaciones.Derivaciones/AplicarMovimiento


