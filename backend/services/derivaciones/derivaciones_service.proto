syntax = "proto3";

package derivaciones;
option go_package="./derivaciones";

message Derivacion {
  string id = 1;
  string expediente_id = 2;
  string tipo = 3;
  string origen = 4;
  string destino = 5;
  string motivo = 6;
  string condicion = 7;
  string registrado_por = 8;
  string fecha_registro = 9;
  // Historial unificado (A + B): MOVIMIENTO (proyección de Expedientes),
  // ANOTACION (notificación, asignación, recepción, aprobación) o LEGADO
  // (derivaciones anteriores a A + B, sin verificación).
  string clase = 10;
  int32 secuencia = 11;        // solo MOVIMIENTO
  string estado_anterior = 12; // solo MOVIMIENTO
  string estado_nuevo = 13;    // solo MOVIMIENTO
  string actor_rol = 14;       // solo MOVIMIENTO
}

// Movimiento publicado por Expedientes (fuente de verdad) vía Transactional
// Outbox. ocurrido_en en RFC3339Nano UTC tal como lo guardó PostgreSQL.
message MovimientoProyectado {
  string movimiento_id = 1;
  string expediente_id = 2;
  int32 secuencia = 3;
  string tipo = 4;
  string actor_id = 5;
  string actor_rol = 6;
  string area_origen = 7;
  string area_destino = 8;
  string estado_anterior = 9;
  string estado_nuevo = 10;
  string motivo = 11;
  string condicion = 12;
  string ocurrido_en = 13;
}

message AplicarMovimientoRequest {
  MovimientoProyectado movimiento = 1;
}

// APLICADO: insertado. DUPLICADO: ya estaba, idéntico campo a campo.
// Errores: Aborted = falta la secuencia anterior (reintentable);
// FailedPrecondition = divergente (mismo id con otro contenido, u otro id con
// la misma secuencia: permanente); InvalidArgument = mensaje inválido.
message AplicarMovimientoResponse {
  enum Resultado {
    RESULTADO_DESCONOCIDO = 0;
    APLICADO = 1;
    DUPLICADO = 2;
  }
  Resultado resultado = 1;
}

message CrearDerivacionRequest {
  string expediente_id = 1;
  string tipo = 2;
  string origen = 3;
  string destino = 4;
  string motivo = 5;
  string condicion = 6;
}

message CrearDerivacionResponse {
  Derivacion derivacion = 1;
}

message GetDerivacionRequest {
  string id = 1;
}

message GetDerivacionResponse {
  Derivacion derivacion = 1;
}

message ListDerivacionesRequest {
  // expediente_id vacio = listar de todos los expedientes (solo personal
  // interno, ver internal/authorization.CanViewAll). Con valor, filtra a
  // ese expediente puntual.
  string expediente_id = 1;
  string tipo = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListDerivacionesResponse {
  repeated Derivacion derivaciones = 1;
  int32 total = 2;
}

// ReporteDerivaciones (Reportes, Fase 2): conteos AGREGADOS de derivaciones,
// sin registros individuales ni textos libres. Exige "reportes.view". Solo
// considera derivaciones de expedientes ACTIVOS y visibles para el usuario
// (alcance que entrega Expedientes.ReporteAlcanceExpedientes). Fecha usada:
// fecha de la derivación (hora de Lima). Origen/destino se normalizan a
// códigos de área; lo irreconocible es SIN_CLASIFICAR (el texto original,
// que puede contener nombres de usuario, nunca sale del servicio).
message ReporteDerivacionesRequest {
  string desde = 1;
  string hasta = 2;
  string tipo_tramite = 3;
  string granularidad = 4;
  // Solo para el reporte de actividad del Gateway (agrupa por rol).
  bool incluir_registros = 5;
}

message ReporteDerivConteo {
  string clave = 1;
  int32 cantidad = 2;
}

message ReporteDerivFlujo {
  string origen = 1;
  string destino = 2;
  int32 cantidad = 3;
}

message ReporteDerivacionesResponse {
  // Derivaciones entre áreas (tipo DERIVACION; incluye devoluciones a
  // Secretaría, que hoy no se distinguen como rechazo).
  int32 total = 1;
  repeated ReporteDerivConteo por_destino = 2;
  repeated ReporteDerivConteo por_origen = 3;
  repeated ReporteDerivFlujo flujo = 4;
  repeated ReporteDerivConteo por_tipo_tramite = 5;
  repeated ReporteDerivConteo serie = 6;
  string granularidad = 7;
  // Otros movimientos (NOTIFICACION, ASIGNACION, RECEPCION, APROBACION):
  // solo cantidad por tipo.
  repeated ReporteDerivConteo otros_movimientos = 8;
  // Derivaciones con origen o destino SIN_CLASIFICAR.
  int32 sin_clasificar = 9;
  // Solo con incluir_registros: clave = ID del usuario que registró.
  repeated ReporteDerivConteo registros_por_usuario = 10;
  string generado = 11;
  // Alcance aplicado (lo informa Expedientes): INSTITUCION o AREA.
  string alcance = 12;
  string area_alcance = 13;
  // Solo con incluir_registros: como registros_por_usuario pero SOLO del
  // tipo DERIVACION (registros_por_usuario cuenta todos los movimientos).
  repeated ReporteDerivConteo derivaciones_por_usuario = 14;
}

service Derivaciones {
  rpc CrearDerivacion(CrearDerivacionRequest) returns (CrearDerivacionResponse);
  rpc GetDerivacion(GetDerivacionRequest) returns (GetDerivacionResponse);
  rpc ListDerivaciones(ListDerivacionesRequest) returns (ListDerivacionesResponse);
  rpc ReporteDerivaciones(ReporteDerivacionesRequest) returns (ReporteDerivacionesResponse);
  // Solo el publicador de Expedientes, con token de servicio (aud=derivaciones,
  // scope derivaciones.proyectar). Rechaza tokens de usuario.
  rpc AplicarMovimiento(AplicarMovimientoRequest) returns (AplicarMovimientoResponse);
}
