syntax = "proto3";

package usuarios;
option go_package="./usuarios";

// Perfil completo. Contiene datos personales: solo debe entregarse a quien
// esté autorizado (ver internal/authorization).
message Usuario {
  string id = 1;
  string nombres = 2;
  string apellidos = 3;
  string dni = 4;
  string telefono = 5;
  string correo = 6;
  string direccion = 7;
  string tipo_usuario = 8;
  bool activo = 9;
  string created_at = 10;
  string updated_at = 11;
  // DNI declarado en el registro público (sin verificar). Vacío para las
  // cuentas institucionales y los solicitantes ya verificados.
  string dni_declarado = 12;
  // El solicitante declaró un DNI que Secretaría todavía no verificó.
  bool identidad_pendiente = 13;
}

// Proyección mínima pensada para resolver identificadores en otros módulos
// (Expedientes, Derivaciones, Seguimiento). No incluye teléfono, correo
// ni dirección. El dni solo se completa cuando quien consulta está
// autorizado a ver datos personales (personal interno o el propio usuario);
// para el resto viaja vacío.
message UsuarioBasic {
  string id = 1;
  string nombres = 2;
  string apellidos = 3;
  string nombre_completo = 4;
  string tipo_usuario = 5;
  string dni = 6;
  // Marca "Identidad no verificada" (no expone el DNI declarado).
  bool identidad_pendiente = 7;
}

message GetUsuarioRequest {
  string id = 1;
}

message GetUsuarioResponse {
  Usuario usuario = 1;
}

message GetUsuarioBasicRequest {
  string id = 1;
}

message GetUsuarioBasicResponse {
  UsuarioBasic usuario = 1;
}

// Resolución por lote: evita N consultas cuando el Dashboard muestra una
// lista de expedientes de distintos solicitantes.
message GetUsuariosBasicRequest {
  repeated string ids = 1;
}

message GetUsuariosBasicResponse {
  repeated UsuarioBasic usuarios = 1;
}

message ListUsuariosRequest {
  string tipo_usuario = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListUsuariosResponse {
  repeated Usuario usuarios = 1;
  int32 total = 2;
}

message SearchUsuariosRequest {
  string query = 1;
  string tipo_usuario = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SearchUsuariosResponse {
  repeated Usuario usuarios = 1;
  int32 total = 2;
}

// UpsertUsuario permite crear/actualizar el perfil asociado a un usuario ya
// existente en Auth. El id NO se genera aquí: debe ser el mismo UUID que
// Auth Service asignó al usuario.
message UpsertUsuarioRequest {
  string id = 1;
  string nombres = 2;
  string apellidos = 3;
  string dni = 4;
  string telefono = 5;
  string correo = 6;
  string direccion = 7;
  string tipo_usuario = 8;
}

message UpsertUsuarioResponse {
  Usuario usuario = 1;
}

// UpdateMyProfile (Paso 22E): edición del PROPIO perfil por el usuario
// autenticado. A propósito NO incluye id/user_id: la identidad se obtiene
// exclusivamente del contexto autenticado (JWT), nunca de un campo del
// request — evita cualquier IDOR. Solo cubre los 3 campos de contacto que
// el propio usuario puede tocar sobre sí mismo (ver Paso 22D/22B):
// nombres, apellidos, DNI, tipo_usuario y activo permanecen fuera de este
// RPC (edición administrativa, no implementada todavía).
// Autoperfil del SOLICITANTE que se registró con Google. El id sale del JWT
// (nunca de la solicitud) y el tipo es siempre SOLICITANTE (rol firmado en el
// token). Solo crea el perfil si no existe: un reintento devuelve el existente
// (created = false) y nunca sobrescribe datos. DNI duplicado -> AlreadyExists.
message CreateMyProfileRequest {
  string nombres = 1;
  string apellidos = 2;
  string dni = 3;
  string telefono = 4;
  string correo = 5;
  string direccion = 6;
  // Registro público: DNI DECLARADO (no reserva el DNI; dni debe ir vacío).
  string dni_declarado = 7;
}

message CreateMyProfileResponse {
  Usuario usuario = 1;
  bool created = 2;
}
// Preparación para el registro público: el Gateway la consulta ANTES de que
// Auth cree una cuenta (registro manual y Google). ready = la base responde y
// el esquema admite perfiles con DNI declarado (migración 003). Sin sesión
// (el registro es anónimo) y sin ningún dato: solo un booleano.
message PublicRegistrationReadyRequest {}
message PublicRegistrationReadyResponse {
  bool ready = 1;
}

message UpdateMyProfileRequest {
  string telefono = 1;
  string correo = 2;
  string direccion = 3;
}

message UpdateMyProfileResponse {
  Usuario usuario = 1;
}

// UpdateUsuarioRole sincroniza ÚNICAMENTE tipo_usuario tras un cambio de rol
// YA confirmado por Auth Service (fuente de verdad real de "rol"). No es un
// Upsert: no crea perfiles nuevos ni toca nombres/apellidos/dni/telefono/
// correo/direccion — si el usuario no tiene perfil registrado en Usuarios
// Service, no hay nada que sincronizar (NotFound).
message UpdateUsuarioRoleRequest {
  string id = 1;
  string tipo_usuario = 2;
}

message UpdateUsuarioRoleResponse {
  Usuario usuario = 1;
}
// Verificación de identidad por Secretaría (permiso
// solicitantes.identidad.verify): pasa el DNI declarado al DNI definitivo del
// perfil, o lo revierte si Auth no pudo completar la verificación.
message VerifiedDniRequest {
  string id = 1;
  string dni = 2;
}
message VerifiedDniResponse {
  Usuario usuario = 1;
}

service Usuarios {
  rpc GetUsuario(GetUsuarioRequest) returns (GetUsuarioResponse);
  rpc GetUsuarioBasic(GetUsuarioBasicRequest) returns (GetUsuarioBasicResponse);
  rpc GetUsuariosBasic(GetUsuariosBasicRequest) returns (GetUsuariosBasicResponse);
  rpc ListUsuarios(ListUsuariosRequest) returns (ListUsuariosResponse);
  rpc SearchUsuarios(SearchUsuariosRequest) returns (SearchUsuariosResponse);
  rpc UpsertUsuario(UpsertUsuarioRequest) returns (UpsertUsuarioResponse);
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
  rpc CreateMyProfile(CreateMyProfileRequest) returns (CreateMyProfileResponse);
  rpc UpdateUsuarioRole(UpdateUsuarioRoleRequest) returns (UpdateUsuarioRoleResponse);
  rpc AssignVerifiedDni(VerifiedDniRequest) returns (VerifiedDniResponse);
  rpc PublicRegistrationReady(PublicRegistrationReadyRequest) returns (PublicRegistrationReadyResponse);
  rpc RevertVerifiedDni(VerifiedDniRequest) returns (VerifiedDniResponse);
}
