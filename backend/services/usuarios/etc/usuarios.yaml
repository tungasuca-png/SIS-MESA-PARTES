Name: usuarios.rpc
ListenOn: 127.0.0.1:8083
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: usuarios.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: usuarios_user
  Password: ${USUARIOS_DB_PASSWORD}
  Database: usuarios_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /usuarios.Usuarios/GetUsuario
      - /usuarios.Usuarios/GetUsuarioBasic
      - /usuarios.Usuarios/GetUsuariosBasic
      - /usuarios.Usuarios/ListUsuarios
      - /usuarios.Usuarios/SearchUsuarios
      - /usuarios.Usuarios/UpsertUsuario
      - /usuarios.Usuarios/UpdateMyProfile
      - /usuarios.Usuarios/UpdateUsuarioRole
