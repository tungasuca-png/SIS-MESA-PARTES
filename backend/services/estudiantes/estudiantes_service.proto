syntax = "proto3";

package estudiantes;
option go_package="./estudiantes";

// Estudiantes Service es el maestro escolar del sistema: identidad del
// estudiante, datos personales, familia (personas, parentesco, apoderado),
// periodos, secciones, matrículas y su historial. NO contiene notas,
// asistencia, documentos ni ningún dato clínico (eso pertenece a otros
// servicios, p. ej. Psicología, que solo guarda estudiante_id como UUID sin
// FK y consulta aquí lo mínimo para mostrarlo). Los consumidores guardan
// solo el UUID estable del estudiante.
message Estudiante {
  string id = 1;
  string codigo = 2;
  string nombres = 3;
  string apellidos = 4;
  string nivel = 5;
  string grado = 6;
  string seccion = 7;
  string turno = 8;
  string estado_matricula = 9;
  // FASE E-05: versión del registro para el control de concurrencia
  // (UpdateEstudiante/ChangeEstadoEstudiante exigen expected_version).
  int32 version = 10;
}

// EstudianteBasico es la vista mínima para listas/selección (búsqueda y
// resolución por lote). FASE 5D: agrega numero_documento (DNI) — el
// selector de estudiantes del frontend lo necesita para que quien busca
// confirme que eligió al estudiante correcto (nombres repetidos son
// comunes); sigue sin fecha_nacimiento ni ningún otro dato del documento.
message EstudianteBasico {
  string id = 1;
  string codigo = 2;
  string nombre_completo = 3;
  string nivel = 4;
  string grado = 5;
  string seccion = 6;
  string estado_matricula = 7;
  string numero_documento = 8;
  // FASE E-04: identificación completa para listados (solo datos BÁSICOS; los
  // personales y sensibles tendrán RPC y permisos propios en fases posteriores).
  string nombres = 9;
  string apellidos = 10;
  string apellido_paterno = 11;
  string apellido_materno = 12;
  string codigo_siagie = 13;
  string tipo_documento = 14;
  string estado = 15;          // estado del REGISTRO (ACTIVO/INACTIVO), no de la matrícula
  string turno = 16;
  int32 version = 17;          // FASE E-05: ver Estudiante.version
}

message GetEstudianteRequest {
  string id = 1;
}

message GetEstudianteResponse {
  Estudiante estudiante = 1;
}

// FASE E-04: q vacío = listado general; si se envía, mínimo 2 caracteres.
// Busca por código, código SIAGIE, documento, nombres y apellidos en cualquier
// orden, sin distinguir mayúsculas ni tildes. Filtros opcionales (vacío = sin
// filtro); nivel/grado/seccion/turno son temporales hasta el dominio Matrícula.
message SearchEstudiantesRequest {
  string q = 1;
  int32 page = 2;
  int32 page_size = 3;
  string estado = 4;
  string nivel = 5;
  string grado = 6;
  string seccion = 7;
  string turno = 8;
  // Etapa 6: orden del listado (lista blanca): "" o "apellidos" (por defecto),
  // "codigo", "recientes" (alta más reciente primero).
  string orden = 9;
}

message SearchEstudiantesResponse {
  repeated EstudianteBasico estudiantes = 1;
  int32 total = 2;
}

message GetEstudiantesBasicRequest {
  repeated string ids = 1;
}

message GetEstudiantesBasicResponse {
  repeated EstudianteBasico estudiantes = 1;
}

// ---- FASE E-05: escritura del maestro ----
// Solo el registro maestro básico (identidad). Nivel/grado/sección/turno y
// estado_matricula NO se escriben aquí: pasarán al dominio Matrícula. No hay
// borrado físico: para retirar un registro se usa ChangeEstadoEstudiante.
// Errores: el mensaje empieza con un código estable (validation_error,
// invalid_document, invalid_state, duplicate_codigo, duplicate_document,
// duplicate_codigo_siagie, student_not_found, version_conflict,
// permission_denied) seguido de ":" y un texto que nunca incluye valores.

// CreateEstudianteRequest: obligatorios codigo y nombres, y apellido_paterno o
// (si no se separan) apellidos. Con apellido_paterno, apellidos se deriva
// (paterno + " " + materno); si también se envía debe coincidir. Vacío =
// no informado (NULL). tipo_documento vacío = SIN_DOCUMENTO; estado vacío =
// ACTIVO. fecha_nacimiento en formato AAAA-MM-DD.
// FASE E-08: los DATOS PERSONALES (fecha_nacimiento, sexo, pais_nacimiento,
// ubigeo_nacimiento, lengua_materna, segunda_lengua) solo se aceptan si quien
// llama tiene TAMBIÉN "estudiantes.personal.update"; si no, permission_denied
// y no se crea nada. foto_ref no es dato personal en E-08 (sin cambios).
message CreateEstudianteRequest {
  string codigo = 1;
  string codigo_siagie = 2;
  string tipo_documento = 3;
  string numero_documento = 4;
  string nombres = 5;
  string apellido_paterno = 6;
  string apellido_materno = 7;
  string apellidos = 8;
  string fecha_nacimiento = 9;
  string sexo = 10;
  string pais_nacimiento = 11;
  string ubigeo_nacimiento = 12;
  string lengua_materna = 13;
  string segunda_lengua = 14;
  string foto_ref = 15;
  string estado = 16;
}

message CreateEstudianteResponse {
  EstudianteBasico estudiante = 1;
}

// UpdateEstudianteRequest: actualización PARCIAL. Solo cambian los campos
// presentes; un campo presente con "" lo deja en NULL (los obligatorios no
// admiten ""). tipo_documento y numero_documento se validan juntos sobre el
// resultado final: cambiar a SIN_DOCUMENTO exige enviar numero_documento = "".
// El código institucional no se modifica. expected_version es obligatorio:
// si el registro cambió desde que el cliente lo leyó, falla con
// version_conflict (ABORTED) y no sobrescribe nada.
// FASE E-08: los seis campos de DATOS PERSONALES (fecha_nacimiento, sexo,
// pais_nacimiento, ubigeo_nacimiento, lengua_materna, segunda_lengua) ya NO se
// modifican aquí: si alguno está presente la solicitud completa se rechaza
// (validation_error) sin tocar nada; se usa UpdateEstudiantePersonal. Los
// campos siguen en el mensaje solo por compatibilidad.
message UpdateEstudianteRequest {
  string id = 1;
  int32 expected_version = 2;
  optional string codigo_siagie = 3;
  optional string tipo_documento = 4;
  optional string numero_documento = 5;
  optional string nombres = 6;
  optional string apellido_paterno = 7;
  optional string apellido_materno = 8;
  optional string apellidos = 9;
  optional string fecha_nacimiento = 10;
  optional string sexo = 11;
  optional string pais_nacimiento = 12;
  optional string ubigeo_nacimiento = 13;
  optional string lengua_materna = 14;
  optional string segunda_lengua = 15;
  optional string foto_ref = 16;
}

message UpdateEstudianteResponse {
  EstudianteBasico estudiante = 1;
}

// ChangeEstadoEstudianteRequest: estado del REGISTRO, solo ACTIVO/INACTIVO
// (RETIRADO/TRASLADADO/CONCLUIDO pertenecen a la futura Matrícula).
message ChangeEstadoEstudianteRequest {
  string id = 1;
  int32 expected_version = 2;
  string estado = 3;
}

message ChangeEstadoEstudianteResponse {
  EstudianteBasico estudiante = 1;
}

// ---- FASE E-08: datos personales (dominio separado) ----
// Solo estos seis campos. Nunca foto_ref, identidad, estado ni datos
// académicos. Lectura con "estudiantes.personal.view" (cada lectura se
// audita como PERSONAL_VIEW, sin valores); edición con
// "estudiantes.personal.update" (PERSONAL_UPDATE). GetEstudiante,
// EstudianteBasico y SearchEstudiantes NO exponen estos campos.

// EstudiantePersonal: "" = no registrado. version = versión del registro
// observada (la misma que usa expected_version).
message EstudiantePersonal {
  string id = 1;
  int32 version = 2;
  string fecha_nacimiento = 3;   // AAAA-MM-DD
  string sexo = 4;               // M | F
  string pais_nacimiento = 5;    // ISO 3166-1 alfa-2
  string ubigeo_nacimiento = 6;  // 6 dígitos, solo con país PE
  string lengua_materna = 7;
  string segunda_lengua = 8;
  // Modelo maestro, etapa 2: DOMICILIO y CONTACTO (dominio personal, E-02).
  // Un solo domicilio vigente. "" = no registrado.
  string domicilio_direccion = 9;
  string domicilio_departamento = 10;
  string domicilio_provincia = 11;
  string domicilio_distrito = 12;
  string domicilio_ubigeo = 13;
  string correo = 14;
  string telefono = 15;
  // EDAD calculada (nunca almacenada) a la fecha de referencia de la
  // solicitud; ausente si no hay fecha de nacimiento o si la referencia es
  // anterior al nacimiento.
  optional int32 edad = 16;
}

message GetEstudiantePersonalRequest {
  string id = 1;
  // Fecha de referencia para la edad (AAAA-MM-DD). Vacía = hoy (Lima).
  string fecha_referencia = 2;
}

message GetEstudiantePersonalResponse {
  EstudiantePersonal personal = 1;
}

// UpdateEstudiantePersonalRequest: PATCH parcial con control de versión.
// Ausente = no cambia; presente con "" = se deja en NULL.
message UpdateEstudiantePersonalRequest {
  string id = 1;
  int32 expected_version = 2;
  optional string fecha_nacimiento = 3;
  optional string sexo = 4;
  optional string pais_nacimiento = 5;
  optional string ubigeo_nacimiento = 6;
  optional string lengua_materna = 7;
  optional string segunda_lengua = 8;
  optional string domicilio_direccion = 9;
  optional string domicilio_departamento = 10;
  optional string domicilio_provincia = 11;
  optional string domicilio_distrito = 12;
  optional string domicilio_ubigeo = 13;
  optional string correo = 14;
  optional string telefono = 15;
}

// Devuelve solo el registro BÁSICO con la versión nueva: quien edita con
// "estudiantes.personal.update" no recibe por esta vía una lectura personal.
message UpdateEstudiantePersonalResponse {
  EstudianteBasico estudiante = 1;
}

// ---- Modelo maestro: resolución e integridad (etapa 1) ----

// ResolveEstudianteRequest: resolución EXACTA para sistemas consumidores.
// Exactamente un criterio: codigo, o tipo_documento + numero_documento.
// Requiere "estudiantes.view". Viaja en el cuerpo (POST) para que el número
// de documento nunca quede en URLs ni en logs de acceso.
// Etapa 5: también por codigo_siagie (14 dígitos, único).
message ResolveEstudianteRequest {
  string codigo = 1;
  string tipo_documento = 2;
  string numero_documento = 3;
  string codigo_siagie = 4;
}

message ResolveEstudianteResponse {
  EstudianteBasico estudiante = 1;
}

// Posibles duplicados para REVISIÓN HUMANA (nunca se fusiona nada
// automáticamente). criterio: MISMO_NOMBRE_Y_FECHA (mismo nombre completo
// normalizado y misma fecha de nacimiento) o MISMO_NOMBRE_SIN_DOCUMENTO
// (mismo nombre y al menos uno sin documento, donde la unicidad por
// documento no protege). Requiere "estudiantes.update".
message GrupoPosibleDuplicado {
  string criterio = 1;
  repeated EstudianteBasico estudiantes = 2;
}

message ListPosiblesDuplicadosRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPosiblesDuplicadosResponse {
  repeated GrupoPosibleDuplicado grupos = 1;
  int32 total = 2;
}

// ---- Modelo maestro: MATRÍCULA (etapa 3, solo lectura) ----
// Historial académico: una matrícula por periodo; los cambios dentro del
// periodo en movimientos. Requiere "estudiantes.view". No incluye el motivo
// de retiro (texto libre, se minimiza).

message PeriodoAcademico {
  string id = 1;
  int32 anio = 2;
  string nombre = 3;
  string estado = 4;              // PLANIFICADO | EN_CURSO | CERRADO
  string fecha_inicio = 5;        // AAAA-MM-DD o ""
  string fecha_fin = 6;
}

message SeccionAcademica {
  string id = 1;
  string nivel = 2;
  string grado = 3;
  string seccion = 4;
  string turno = 5;
  string aula = 6;
  string periodo_id = 7;
  optional int32 vacantes = 8;    // ausente = sin límite registrado
  int32 matriculados = 9;         // matrículas MATRICULADO (solo en ListSecciones)
}

message MovimientoMatricula {
  string tipo = 1;
  string fecha = 2;
  string seccion_anterior_id = 3;
  string seccion_nueva_id = 4;
}

message Matricula {
  string id = 1;
  PeriodoAcademico periodo = 2;
  SeccionAcademica seccion = 3;   // ausente si no tiene sección asignada
  string estado_matricula = 4;    // MATRICULADO | RETIRADO | TRASLADADO | CONCLUIDO
  string fecha_matricula = 5;
  string fecha_retiro = 6;
  string origen = 7;              // REGISTRO | MIGRACION_LEGADO
  int32 version = 8;
  repeated MovimientoMatricula movimientos = 9;
  string estudiante_id = 10;
}

message ListMatriculasEstudianteRequest {
  string estudiante_id = 1;
}

message ListMatriculasEstudianteResponse {
  repeated Matricula matriculas = 1;
}

// ---- Modelo maestro: FAMILIA (etapa 4) ----
// Lectura con "estudiantes.familia.view" (auditada como FAMILIA_VIEW);
// vinculación con "estudiantes.familia.update" (FAMILIA_UPDATE). Nunca se
// expone por las consultas de identidad.

message Persona {
  string id = 1;
  string tipo_documento = 2;
  string numero_documento = 3;
  string nombres = 4;
  string apellido_paterno = 5;
  string apellido_materno = 6;
  int32 version = 7;              // etapa 5: para UpdatePersona (expected_version)
}

message Familiar {
  string relacion_id = 1;
  Persona persona = 2;
  string parentesco = 3;
  bool es_apoderado = 4;
  bool vigente = 5;
  string desde = 6;
  string hasta = 7;
}

message ListFamiliaresEstudianteRequest {
  string estudiante_id = 1;
  bool incluir_historial = 2;     // false = solo relaciones vigentes
}

message ListFamiliaresEstudianteResponse {
  repeated Familiar familiares = 1;
}

// VincularFamiliarRequest: persona_id (persona ya registrada) O los datos de
// la persona. Con documento, si la persona ya existe se reutiliza (una sola
// persona para varios estudiantes); si los nombres no coinciden se rechaza
// (no se sobrescribe ni se fusiona). Sin documento se registra una persona
// nueva.
message VincularFamiliarRequest {
  string estudiante_id = 1;
  string persona_id = 2;
  Persona persona = 3;
  string parentesco = 4;
  bool es_apoderado = 5;
  string desde = 6;               // AAAA-MM-DD, opcional
}

message VincularFamiliarResponse {
  Familiar familiar = 1;
}

// DesvincularFamiliarRequest: cierra la relación (vigente = false, hasta);
// no borra nada, el historial se conserva.
message DesvincularFamiliarRequest {
  string estudiante_id = 1;
  string relacion_id = 2;
  string hasta = 3;               // AAAA-MM-DD, vacío = hoy (Lima)
}

message DesvincularFamiliarResponse {
  Familiar familiar = 1;
}

// ActualizarFamiliarRequest (etapa 5): cambia SOLO el rol de apoderado de
// una relación vigente. El parentesco no se edita: se cierra la relación y
// se registra otra, para conservar el historial. Sigue la regla de un solo
// apoderado vigente (primero se quita al anterior).
message ActualizarFamiliarRequest {
  string estudiante_id = 1;
  string relacion_id = 2;
  bool es_apoderado = 3;
}

message ActualizarFamiliarResponse {
  Familiar familiar = 1;
}

// CambiarParentescoFamiliarRequest (etapa 6): corrige el parentesco de una
// relación vigente CONSERVANDO el historial, en UNA transacción: cierra la
// relación actual (hasta = desde) y crea otra con la misma persona, el nuevo parentesco y el mismo
// rol de apoderado. Si algo falla (p. ej. ya hay una MADRE vigente), no
// cambia nada. "estudiantes.familia.update".
message CambiarParentescoFamiliarRequest {
  string estudiante_id = 1;
  string relacion_id = 2;
  string parentesco = 3;
  string desde = 4;               // AAAA-MM-DD, vacío = hoy (Lima); no futura
}

message CambiarParentescoFamiliarResponse {
  Familiar anterior = 1;          // relación cerrada (historial)
  Familiar familiar = 2;          // relación nueva vigente
}

// ---- Etapa 6: HISTORIAL de cambios del estudiante ----
// Eventos de CAMBIO registrados en la auditoría (nunca lecturas): alta,
// edición, cambio de estado, datos personales, familia y matrícula. Solo
// nombres de campos, NUNCA valores anteriores ni nuevos. Requiere
// "estudiantes.view". Más reciente primero, paginado.
message EventoHistorial {
  string id = 1;
  string accion = 2;              // CREATE | UPDATE | CHANGE_ESTADO | PERSONAL_UPDATE | FAMILIA_UPDATE | MATRICULA_UPDATE
  string fecha_hora = 3;          // RFC 3339
  string usuario_id = 4;          // quien hizo el cambio (resolver con Usuarios)
  repeated string campos = 5;
  string estado_anterior = 6;     // solo CHANGE_ESTADO (ACTIVO/INACTIVO)
  string estado_nuevo = 7;
  int32 version_resultante = 8;
}

message ListHistorialEstudianteRequest {
  string estudiante_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListHistorialEstudianteResponse {
  repeated EventoHistorial eventos = 1;
  int32 total = 2;
}

// ---- Modelo maestro, etapa 5: PERSONAS (padres, apoderados) ----
// Lectura con "estudiantes.familia.view", escritura con
// "estudiantes.familia.update". GetPersona se audita como PERSONA_VIEW y
// UpdatePersona como PERSONA_UPDATE (nombres de campos, nunca valores).
// Errores nuevos: persona_not_found, duplicate_persona, version_conflict.

message VinculoPersona {
  string relacion_id = 1;
  EstudianteBasico estudiante = 2;
  string parentesco = 3;
  bool es_apoderado = 4;
  bool vigente = 5;
  string desde = 6;
  string hasta = 7;
}

message CreatePersonaRequest {
  Persona persona = 1;            // id y version se ignoran
}

message PersonaResponse {
  Persona persona = 1;
}

message GetPersonaRequest {
  string id = 1;
  bool incluir_historial = 2;     // false = solo vínculos vigentes
}

message GetPersonaResponse {
  Persona persona = 1;
  repeated VinculoPersona vinculos = 2;
}

// SearchPersonasRequest: q de 2 a 100 caracteres; busca por número de
// documento y por nombres y apellidos (cualquier orden, sin tildes).
message SearchPersonasRequest {
  string q = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchPersonasResponse {
  repeated Persona personas = 1;
  int32 total = 2;
}

// UpdatePersonaRequest: PATCH parcial con control de versión. Ausente = no
// cambia; presente con "" = NULL (nombres es obligatorio). El documento se
// valida sobre el resultado final y no puede repetir el de otra persona.
message UpdatePersonaRequest {
  string id = 1;
  int32 expected_version = 2;
  optional string tipo_documento = 3;
  optional string numero_documento = 4;
  optional string nombres = 5;
  optional string apellido_paterno = 6;
  optional string apellido_materno = 7;
}

// ---- Modelo maestro, etapa 5: PERIODOS, SECCIONES y MATRÍCULAS ----
// Lectura con "estudiantes.view"; escritura con
// "estudiantes.matricula.update". Toda operación sobre una matrícula se
// audita en el estudiante como MATRICULA_UPDATE. Reglas de integridad:
//   - Periodo: PLANIFICADO -> EN_CURSO -> CERRADO (solo hacia adelante).
//   - En un periodo CERRADO no se registran secciones ni matrículas ni se
//     modifican, salvo ConcluirMatricula (cierre de fin de periodo).
//   - Solo se matricula a un estudiante con registro ACTIVO; una matrícula
//     por estudiante y periodo; la sección debe ser del mismo periodo y
//     tener vacantes si su límite está registrado.
//   - Transiciones de matrícula: MATRICULADO -> RETIRADO | TRASLADADO |
//     CONCLUIDO; RETIRADO | TRASLADADO -> MATRICULADO (reingreso). Cada
//     una deja un movimiento (append-only) y nunca borra la anterior.
//   - Las fechas de los movimientos no pueden ser futuras.
// Errores nuevos: periodo_not_found, duplicate_periodo, periodo_cerrado,
// invalid_transition, seccion_not_found, duplicate_seccion, sin_vacantes,
// matricula_not_found, duplicate_matricula, estudiante_inactivo,
// version_conflict.

message CreatePeriodoRequest {
  int32 anio = 1;
  string nombre = 2;
  string fecha_inicio = 3;        // AAAA-MM-DD, opcional
  string fecha_fin = 4;
}

message PeriodoResponse {
  PeriodoAcademico periodo = 1;
}

message ListPeriodosRequest {}

message ListPeriodosResponse {
  repeated PeriodoAcademico periodos = 1;
}

message ChangeEstadoPeriodoRequest {
  string id = 1;
  string estado = 2;              // EN_CURSO | CERRADO
}

message CreateSeccionRequest {
  string periodo_id = 1;
  string nivel = 2;               // INICIAL | PRIMARIA | SECUNDARIA
  string grado = 3;
  string seccion = 4;
  string turno = 5;               // opcional
  string aula = 6;                // opcional
  optional int32 vacantes = 7;
}

message SeccionResponse {
  SeccionAcademica seccion = 1;
}

message ListSeccionesRequest {
  string periodo_id = 1;
}

message ListSeccionesResponse {
  repeated SeccionAcademica secciones = 1;
}

message MatriculaResponse {
  Matricula matricula = 1;
}

message MatricularEstudianteRequest {
  string estudiante_id = 1;
  string periodo_id = 2;
  string seccion_id = 3;          // opcional: puede asignarse después
  string fecha_matricula = 4;     // AAAA-MM-DD, vacío = hoy (Lima)
}

// CambiarSeccionMatriculaRequest: asigna o cambia la sección dentro del
// mismo periodo (movimiento CAMBIO_SECCION, o CAMBIO_TURNO si solo cambia
// el turno).
message CambiarSeccionMatriculaRequest {
  string matricula_id = 1;
  int32 expected_version = 2;
  string seccion_id = 3;
  string fecha = 4;               // vacío = hoy (Lima)
  string motivo = 5;              // opcional, máx. 200
}

// RetirarMatriculaRequest: tipo RETIRO (estado RETIRADO) o TRASLADO
// (estado TRASLADADO, movimiento TRASLADO_SALIDA).
message RetirarMatriculaRequest {
  string matricula_id = 1;
  int32 expected_version = 2;
  string tipo = 3;
  string fecha = 4;               // vacío = hoy (Lima)
  string motivo = 5;              // obligatorio, máx. 200
}

message ReingresarMatriculaRequest {
  string matricula_id = 1;
  int32 expected_version = 2;
  string fecha = 3;               // vacío = hoy; no anterior al retiro
  string motivo = 4;              // opcional
}

// ConcluirMatriculaRequest: el estudiante terminó el periodo (CONCLUIDO).
// Exige periodo EN_CURSO o CERRADO. No decide aprobación ni promoción: esas
// reglas no están definidas por el colegio.
message ConcluirMatriculaRequest {
  string matricula_id = 1;
  int32 expected_version = 2;
  string fecha = 3;               // vacío = hoy (Lima)
}

// Nómina de un periodo (opcionalmente de una sección o estado).
message MatriculaNomina {
  Matricula matricula = 1;        // sin movimientos
  EstudianteBasico estudiante = 2;
}

message ListMatriculasPeriodoRequest {
  string periodo_id = 1;
  string seccion_id = 2;
  string estado_matricula = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListMatriculasPeriodoResponse {
  repeated MatriculaNomina matriculas = 1;
  int32 total = 2;
}

service Estudiantes {
  rpc GetEstudiante(GetEstudianteRequest) returns (GetEstudianteResponse);
  rpc SearchEstudiantes(SearchEstudiantesRequest) returns (SearchEstudiantesResponse);
  rpc GetEstudiantesBasic(GetEstudiantesBasicRequest) returns (GetEstudiantesBasicResponse);
  rpc CreateEstudiante(CreateEstudianteRequest) returns (CreateEstudianteResponse);
  rpc UpdateEstudiante(UpdateEstudianteRequest) returns (UpdateEstudianteResponse);
  rpc ChangeEstadoEstudiante(ChangeEstadoEstudianteRequest) returns (ChangeEstadoEstudianteResponse);
  rpc GetEstudiantePersonal(GetEstudiantePersonalRequest) returns (GetEstudiantePersonalResponse);
  rpc UpdateEstudiantePersonal(UpdateEstudiantePersonalRequest) returns (UpdateEstudiantePersonalResponse);
  rpc ResolveEstudiante(ResolveEstudianteRequest) returns (ResolveEstudianteResponse);
  rpc ListPosiblesDuplicados(ListPosiblesDuplicadosRequest) returns (ListPosiblesDuplicadosResponse);
  rpc ListMatriculasEstudiante(ListMatriculasEstudianteRequest) returns (ListMatriculasEstudianteResponse);
  rpc ListFamiliaresEstudiante(ListFamiliaresEstudianteRequest) returns (ListFamiliaresEstudianteResponse);
  rpc VincularFamiliar(VincularFamiliarRequest) returns (VincularFamiliarResponse);
  rpc DesvincularFamiliar(DesvincularFamiliarRequest) returns (DesvincularFamiliarResponse);
  // Etapa 5: familia y personas.
  rpc ActualizarFamiliar(ActualizarFamiliarRequest) returns (ActualizarFamiliarResponse);
  rpc CreatePersona(CreatePersonaRequest) returns (PersonaResponse);
  rpc GetPersona(GetPersonaRequest) returns (GetPersonaResponse);
  rpc SearchPersonas(SearchPersonasRequest) returns (SearchPersonasResponse);
  rpc UpdatePersona(UpdatePersonaRequest) returns (PersonaResponse);
  // Etapa 5: periodos, secciones y matrículas.
  rpc CreatePeriodo(CreatePeriodoRequest) returns (PeriodoResponse);
  rpc ListPeriodos(ListPeriodosRequest) returns (ListPeriodosResponse);
  rpc ChangeEstadoPeriodo(ChangeEstadoPeriodoRequest) returns (PeriodoResponse);
  rpc CreateSeccion(CreateSeccionRequest) returns (SeccionResponse);
  rpc ListSecciones(ListSeccionesRequest) returns (ListSeccionesResponse);
  rpc MatricularEstudiante(MatricularEstudianteRequest) returns (MatriculaResponse);
  rpc CambiarSeccionMatricula(CambiarSeccionMatriculaRequest) returns (MatriculaResponse);
  rpc RetirarMatricula(RetirarMatriculaRequest) returns (MatriculaResponse);
  rpc ReingresarMatricula(ReingresarMatriculaRequest) returns (MatriculaResponse);
  rpc ConcluirMatricula(ConcluirMatriculaRequest) returns (MatriculaResponse);
  rpc ListMatriculasPeriodo(ListMatriculasPeriodoRequest) returns (ListMatriculasPeriodoResponse);
  // Etapa 6: parentesco con historial e historial de cambios.
  rpc CambiarParentescoFamiliar(CambiarParentescoFamiliarRequest) returns (CambiarParentescoFamiliarResponse);
  rpc ListHistorialEstudiante(ListHistorialEstudianteRequest) returns (ListHistorialEstudianteResponse);
}
