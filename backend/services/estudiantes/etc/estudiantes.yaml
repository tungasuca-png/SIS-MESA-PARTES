Name: estudiantes.rpc
# Solo loopback: en esta fase no hay Gateway (ni ningún otro llamador)
# apuntando aquí todavía, y los datos son de menores de edad — mismo
# criterio de precaución que Derivaciones/Psicología.
ListenOn: 127.0.0.1:8087
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: estudiantes.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: estudiantes_user
  # Secreto por variable de entorno (backend/.env); nunca en este archivo.
  Password: ${ESTUDIANTES_DB_PASSWORD}
  Database: estudiantes_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

# Sistemas consumidores (client credentials): misma clave de servicio que
# Auth (SERVICE_JWT_SECRET, distinta de JWT_SECRET). Sin ella, solo se
# aceptan tokens de usuario.
ServiceJWTSecret: ${SERVICE_JWT_SECRET}
ServiceTokenIssuer: tungasuca-auth
ServiceTokenAudience: estudiantes

# El tiempo por defecto de go-zero es 2 s por RPC: no alcanza para validar o
# registrar cientos de estudiantes de un Excel (cada alta es su propia
# transacción con auditoría). Solo estos métodos tienen más tiempo.
MethodTimeouts:
  - FullMethod: /estudiantes.Estudiantes/PreviewImportacionEstudiantes
    Timeout: 60s
  - FullMethod: /estudiantes.Estudiantes/ConfirmarImportacionEstudiantes
    Timeout: 180s
  - FullMethod: /estudiantes.Estudiantes/ExportarEstudiantes
    Timeout: 60s
  - FullMethod: /estudiantes.Estudiantes/PlantillaEstudiantes
    Timeout: 10s
  - FullMethod: /estudiantes.Estudiantes/AnalizarDatosEstudiantes
    Timeout: 60s
  - FullMethod: /estudiantes.Estudiantes/ConfirmarDatosEstudiantes
    Timeout: 180s
  - FullMethod: /estudiantes.Estudiantes/ExportarDatosEstudiantes
    Timeout: 60s

# go-zero registra el contenido de las solicitudes (stat log). Todo RPC de
# este servicio lleva datos personales de menores (nombres, DNI, fecha de
# nacimiento): se excluye el contenido de TODOS los métodos. FASE E-05: una
# prueba (internal/config) falla si un RPC del proto no está en esta lista.
Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /estudiantes.Estudiantes/GetEstudiante
      - /estudiantes.Estudiantes/SearchEstudiantes
      - /estudiantes.Estudiantes/GetEstudiantesBasic
      - /estudiantes.Estudiantes/CreateEstudiante
      - /estudiantes.Estudiantes/UpdateEstudiante
      - /estudiantes.Estudiantes/ChangeEstadoEstudiante
      # FASE E-08: datos personales.
      - /estudiantes.Estudiantes/GetEstudiantePersonal
      - /estudiantes.Estudiantes/UpdateEstudiantePersonal
      # Modelo maestro: resolución, duplicados, matrícula y familia.
      - /estudiantes.Estudiantes/ResolveEstudiante
      - /estudiantes.Estudiantes/ListPosiblesDuplicados
      - /estudiantes.Estudiantes/ListMatriculasEstudiante
      - /estudiantes.Estudiantes/ListFamiliaresEstudiante
      - /estudiantes.Estudiantes/VincularFamiliar
      - /estudiantes.Estudiantes/DesvincularFamiliar
      # Etapa 5: familia, personas, periodos, secciones y matrículas.
      - /estudiantes.Estudiantes/ActualizarFamiliar
      - /estudiantes.Estudiantes/CreatePersona
      - /estudiantes.Estudiantes/GetPersona
      - /estudiantes.Estudiantes/SearchPersonas
      - /estudiantes.Estudiantes/UpdatePersona
      - /estudiantes.Estudiantes/CreatePeriodo
      - /estudiantes.Estudiantes/ListPeriodos
      - /estudiantes.Estudiantes/ChangeEstadoPeriodo
      - /estudiantes.Estudiantes/CreateSeccion
      - /estudiantes.Estudiantes/ListSecciones
      - /estudiantes.Estudiantes/MatricularEstudiante
      - /estudiantes.Estudiantes/CambiarSeccionMatricula
      - /estudiantes.Estudiantes/RetirarMatricula
      - /estudiantes.Estudiantes/ReingresarMatricula
      - /estudiantes.Estudiantes/ConcluirMatricula
      - /estudiantes.Estudiantes/ListMatriculasPeriodo
      # Etapa 6: parentesco con historial e historial de cambios.
      - /estudiantes.Estudiantes/CambiarParentescoFamiliar
      - /estudiantes.Estudiantes/ListHistorialEstudiante
      # Importación/exportación Excel: el archivo trae DNI y nombres de menores.
      - /estudiantes.Estudiantes/PlantillaEstudiantes
      - /estudiantes.Estudiantes/PreviewImportacionEstudiantes
      - /estudiantes.Estudiantes/ConfirmarImportacionEstudiantes
      - /estudiantes.Estudiantes/ExportarEstudiantes
      # Motor universal de datos: archivos y vistas previas con datos de menores.
      - /estudiantes.Estudiantes/CamposDatosEstudiantes
      - /estudiantes.Estudiantes/AnalizarDatosEstudiantes
      - /estudiantes.Estudiantes/ConfirmarDatosEstudiantes
      - /estudiantes.Estudiantes/ExportarDatosEstudiantes
      - /estudiantes.Estudiantes/ListPlantillasDatos
      - /estudiantes.Estudiantes/GuardarPlantillaDatos
      - /estudiantes.Estudiantes/EliminarPlantillaDatos
