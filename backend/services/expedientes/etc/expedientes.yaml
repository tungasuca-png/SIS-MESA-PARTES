Name: expedientes.rpc
ListenOn: 127.0.0.1:8082
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: expedientes.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: expedientes_user
  Password: ${EXPEDIENTES_DB_PASSWORD}
  Database: expedientes_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /expedientes.Expedientes/CreateExpediente
      - /expedientes.Expedientes/GetExpediente
      - /expedientes.Expedientes/ListExpedientes
      - /expedientes.Expedientes/UpdateExpediente
      - /expedientes.Expedientes/ChangeEstado
      - /expedientes.Expedientes/DeleteExpediente
      - /expedientes.Expedientes/UpdateArea
      - /expedientes.Expedientes/DerivarExpediente
      - /expedientes.Expedientes/RechazarExpediente
      - /expedientes.Expedientes/CorregirExpediente
      - /expedientes.Expedientes/ResolverExpediente
      - /expedientes.Expedientes/ValidateDerivacion
