Name: expedientes.rpc
ListenOn: 0.0.0.0:8082
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: expedientes.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: expedientes_user
  Password: expedientes_password
  Database: expedientes_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /expedientes.Expedientes/CreateExpediente
