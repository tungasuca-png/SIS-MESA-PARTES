syntax = "proto3";

package expedientes;
option go_package="./expedientes";

message Expediente {
  string id = 1;
  string codigo = 2;
  string tipo = 3;
  string asunto = 4;
  string descripcion = 5;
  string solicitante_id = 6;
  string estado = 7;
  string prioridad = 8;
  string fecha_registro = 9;
  string fecha_actualizacion = 10;
  bool activo = 11;
  string area_actual = 12;
}

message CreateExpedienteRequest {
  string tipo = 1;
  string asunto = 2;
  string descripcion = 3;
  string prioridad = 4;
}

message CreateExpedienteResponse {
  Expediente expediente = 1;
}

message GetExpedienteRequest {
  // Acepta el UUID interno o el codigo legible (EXP-2026-000001).
  string id = 1;
}

message GetExpedienteResponse {
  Expediente expediente = 1;
}

message ListExpedientesRequest {
  string estado = 1;
  string prioridad = 2;
  string tipo = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListExpedientesResponse {
  repeated Expediente expedientes = 1;
  int32 total = 2;
}

message UpdateExpedienteRequest {
  string id = 1;
  string asunto = 2;
  string descripcion = 3;
  string prioridad = 4;
}

message UpdateExpedienteResponse {
  Expediente expediente = 1;
}

// Movimiento: registro inmutable de un cambio de área y/o estado (A + B).
// Se crea en la MISMA transacción que el cambio del expediente y su evento de
// outbox. ocurrido_en en RFC3339Nano (UTC, precisión de PostgreSQL).
message Movimiento {
  string id = 1;
  string expediente_id = 2;
  int32 secuencia = 3;
  string tipo = 4;
  string actor_id = 5;
  string actor_rol = 6;
  string area_origen = 7;
  string area_destino = 8;
  string estado_anterior = 9;
  string estado_nuevo = 10;
  string motivo = 11;
  string condicion = 12;
  string ocurrido_en = 13;
}

// Todas las operaciones que mueven área o estado exigen idempotency_key (UUID):
// la misma clave con el mismo contenido devuelve el MISMO movimiento
// (repetido = true); con otro contenido, AlreadyExists.
message ChangeEstadoRequest {
  string id = 1;
  string nuevo_estado = 2;
  string estado_esperado = 3;
  string idempotency_key = 4;
  string motivo = 5;
}

message ChangeEstadoResponse {
  Expediente expediente = 1;
  Movimiento movimiento = 2;
  bool repetido = 3;
}

message DeleteExpedienteRequest {
  string id = 1;
}

message DeleteExpedienteResponse {
  bool success = 1;
}

// UpdateArea queda deshabilitado (A + B): cambiaba el área sin reglas ni
// trazabilidad. Responde FailedPrecondition; usar DerivarExpediente.
message UpdateAreaRequest {
  string id = 1;
  string area = 2;
}

message UpdateAreaResponse {
  Expediente expediente = 1;
}

// DerivarExpediente (Etapa 3): operación de negocio real, distinta de
// UpdateArea genérico — valida que la transición de área esté confirmada
// para el tipo de trámite del expediente (ver internal/estados.CanDerivar)
// antes de moverlo. UpdateArea sigue existiendo tal cual para el resto de
// usos (administrativos, tipos genéricos) que no pasan por esta regla.
message DerivarExpedienteRequest {
  string id = 1;
  string area_destino = 2;
  string motivo = 3;
  string condicion = 4;
  string area_origen_esperada = 5;
  string idempotency_key = 6;
}

message DerivarExpedienteResponse {
  Expediente expediente = 1;
  Movimiento movimiento = 2;
  bool repetido = 3;
}

// Etapa 4: cierre real de F2 (CERTIFICADO/CONSTANCIA) y F4 (PERMISO/
// JUSTIFICACION_FALTA/JUSTIFICACION_TARDANZA) — ver
// docs/etapa-4-resolucion-cierre-f2-f4.md.

// RechazarExpediente: exclusivo de F4. Lo ejecuta quien tiene actualmente
// el expediente (DIRECTOR o SUBDIRECTOR) para devolverlo a SECRETARIA con
// estado OBSERVADO, para que el solicitante corrija.
message RechazarExpedienteRequest {
  string id = 1;
  string motivo = 2;
  string area_origen_esperada = 3;
  string idempotency_key = 4;
}

message RechazarExpedienteResponse {
  Expediente expediente = 1;
  Movimiento movimiento = 2;
  bool repetido = 3;
}

// CorregirExpediente: exclusivo del propio solicitante, sobre su propio
// expediente en estado OBSERVADO. Actualiza la descripción (la corrección)
// y reingresa a la revisión de Secretaría (vuelve a PENDIENTE).
message CorregirExpedienteRequest {
  string id = 1;
  string descripcion = 2;
  string idempotency_key = 3;
}

message CorregirExpedienteResponse {
  Expediente expediente = 1;
  Movimiento movimiento = 2;
  bool repetido = 3;
}

// ResolverExpediente: exclusivo de F2, lo ejecuta Secretaría cuando ya
// tiene el documento final (verificado por el Gateway contra Documentos
// Service antes de llamar acá) y cierra el expediente como ATENDIDO.
message ResolverExpedienteRequest {
  string id = 1;
  string idempotency_key = 2;
}

message ResolverExpedienteResponse {
  Expediente expediente = 1;
  Movimiento movimiento = 2;
  bool repetido = 3;
}

// ValidateDerivacion (Paso 20B.2): RPC de SOLO LECTURA, sin ningún efecto
// secundario — expone las mismas reglas reales que ya usa DerivarExpediente
// (estados.IsValidArea + estados.CanDerivar, sobre el Tipo/AreaActual REAL
// del expediente, nunca datos enviados por el cliente) para que otro
// microservicio (Derivaciones) pueda validar una transición SIN ejecutarla.
// No mueve area_actual, no cambia estado, no crea nada.
message ValidateDerivacionRequest {
  string expediente_id = 1;
  string area_destino = 2;
}

message ValidateDerivacionResponse {
  bool valido = 1;
}

// ReporteExpedientes (Reportes, Fase 1): estadísticas AGREGADAS de
// expedientes, calculadas en el servidor con las MISMAS reglas de alcance que
// ListExpedientes (ADMIN/SECRETARIA: toda la institución; el resto del
// personal: solo su área actual). Exige "reportes.view". Solo conteos: nunca
// devuelve expedientes, solicitantes ni datos personales.
//
// Fecha usada: SIEMPRE fecha_registro (fecha de recepción), en hora de Lima.
// desde/hasta (AAAA-MM-DD) son inclusivos y opcionales. Todos los filtros se
// combinan (AND) y afectan a todas las agrupaciones.
message ReporteExpedientesRequest {
  string desde = 1;
  string hasta = 2;
  string estado = 3;
  string tipo = 4;
  string prioridad = 5;
  string area = 6;
  // Fase 2 (opcionales; sin ellos la respuesta es la de la Fase 1):
  // granularidad DIA | SEMANA | MES de la serie "serie" (por fecha de
  // registro); incluir_registros agrega los conteos por usuario registrador
  // (solo para el reporte de actividad del Gateway, que los agrupa por ROL
  // y nunca expone identificadores).
  string granularidad = 7;
  bool incluir_registros = 8;
}

// Celda de una tabla cruzada (fila x columna).
message ReporteCruce {
  string fila = 1;
  string columna = 2;
  int32 cantidad = 3;
}

message ReporteConteo {
  string clave = 1;
  int32 cantidad = 2;
}

message ReporteExpedientesResponse {
  int32 total = 1;
  // Catálogo completo (incluye ceros), en orden estable.
  repeated ReporteConteo por_estado = 2;
  repeated ReporteConteo por_tipo = 3;
  repeated ReporteConteo por_prioridad = 4;
  repeated ReporteConteo por_area = 5;
  // Mes de registro (AAAA-MM), continuo y con ceros, del primer al último mes
  // del periodo (o de los datos, si no se indica periodo).
  repeated ReporteConteo por_mes = 6;
  // Pendientes = PENDIENTE + EN_PROCESO; antigüedad en días desde
  // fecha_registro hasta hoy (rangos 0-3, 4-7, 8-15, 16-30, 31+). No es un
  // indicador de incumplimiento: no existen plazos institucionales.
  int32 pendientes = 7;
  repeated ReporteConteo pendientes_por_antiguedad = 8;
  // INSTITUCION o AREA (el alcance real aplicado según el rol).
  string alcance = 9;
  string area_alcance = 10;
  // Momento de cálculo (RFC 3339).
  string generado = 11;
  // Fase 2: serie continua por la granularidad pedida (claves AAAA-MM-DD
  // para DIA y SEMANA —lunes—, AAAA-MM para MES); vacía si no se pidió.
  repeated ReporteConteo serie = 12;
  string granularidad = 13;
  // Tablas cruzadas con el estado ACTUAL (solo celdas con valor).
  repeated ReporteCruce area_estado = 14;
  repeated ReporteCruce tipo_estado = 15;
  // Solo con incluir_registros: clave = ID del usuario que registró.
  repeated ReporteConteo registros_por_usuario = 16;
  // Solo con granularidad: celdas (fila = clave del periodo de la serie,
  // columna = estado ACTUAL) con cantidad > 0. Registros por periodo según
  // su estado actual; no es historial de estados.
  repeated ReporteCruce serie_estado = 17;
}

// ReporteAlcanceExpedientes (Fase 2): IDs y tipo de los expedientes ACTIVOS
// visibles para el usuario (mismo permiso "reportes.view" y mismo alcance que
// ReporteExpedientes). Lo usan Derivaciones y Documentos para sus reportes:
// así excluyen bajas lógicas y respetan el alcance sin leer esta base.
message ReporteAlcanceRequest {
  string tipo = 1;
}

message ReporteExpedienteRef {
  string id = 1;
  string tipo = 2;
}

message ReporteAlcanceResponse {
  repeated ReporteExpedienteRef expedientes = 1;
  // INSTITUCION o AREA, como en ReporteExpedientes.
  string alcance = 2;
  string area_alcance = 3;
}

service Expedientes {
  rpc CreateExpediente(CreateExpedienteRequest) returns (CreateExpedienteResponse);
  rpc GetExpediente(GetExpedienteRequest) returns (GetExpedienteResponse);
  rpc ListExpedientes(ListExpedientesRequest) returns (ListExpedientesResponse);
  rpc UpdateExpediente(UpdateExpedienteRequest) returns (UpdateExpedienteResponse);
  rpc ChangeEstado(ChangeEstadoRequest) returns (ChangeEstadoResponse);
  rpc DeleteExpediente(DeleteExpedienteRequest) returns (DeleteExpedienteResponse);
  rpc UpdateArea(UpdateAreaRequest) returns (UpdateAreaResponse);
  rpc DerivarExpediente(DerivarExpedienteRequest) returns (DerivarExpedienteResponse);
  rpc RechazarExpediente(RechazarExpedienteRequest) returns (RechazarExpedienteResponse);
  rpc CorregirExpediente(CorregirExpedienteRequest) returns (CorregirExpedienteResponse);
  rpc ResolverExpediente(ResolverExpedienteRequest) returns (ResolverExpedienteResponse);
  rpc ValidateDerivacion(ValidateDerivacionRequest) returns (ValidateDerivacionResponse);
  rpc ReporteExpedientes(ReporteExpedientesRequest) returns (ReporteExpedientesResponse);
  rpc ReporteAlcanceExpedientes(ReporteAlcanceRequest) returns (ReporteAlcanceResponse);
}
