syntax = "proto3";

package expedientes;
option go_package="./expedientes";

message Expediente {
  string id = 1;
  string codigo = 2;
  string tipo = 3;
  string asunto = 4;
  string descripcion = 5;
  string solicitante_id = 6;
  string estado = 7;
  string prioridad = 8;
  string fecha_registro = 9;
  string fecha_actualizacion = 10;
  bool activo = 11;
  string area_actual = 12;
}

message CreateExpedienteRequest {
  string tipo = 1;
  string asunto = 2;
  string descripcion = 3;
  string prioridad = 4;
}

message CreateExpedienteResponse {
  Expediente expediente = 1;
}

message GetExpedienteRequest {
  // Acepta el UUID interno o el codigo legible (EXP-2026-000001).
  string id = 1;
}

message GetExpedienteResponse {
  Expediente expediente = 1;
}

message ListExpedientesRequest {
  string estado = 1;
  string prioridad = 2;
  string tipo = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListExpedientesResponse {
  repeated Expediente expedientes = 1;
  int32 total = 2;
}

message UpdateExpedienteRequest {
  string id = 1;
  string asunto = 2;
  string descripcion = 3;
  string prioridad = 4;
}

message UpdateExpedienteResponse {
  Expediente expediente = 1;
}

message ChangeEstadoRequest {
  string id = 1;
  string nuevo_estado = 2;
}

message ChangeEstadoResponse {
  Expediente expediente = 1;
}

message DeleteExpedienteRequest {
  string id = 1;
}

message DeleteExpedienteResponse {
  bool success = 1;
}

message UpdateAreaRequest {
  string id = 1;
  string area = 2;
}

message UpdateAreaResponse {
  Expediente expediente = 1;
}

// DerivarExpediente (Etapa 3): operación de negocio real, distinta de
// UpdateArea genérico — valida que la transición de área esté confirmada
// para el tipo de trámite del expediente (ver internal/estados.CanDerivar)
// antes de moverlo. UpdateArea sigue existiendo tal cual para el resto de
// usos (administrativos, tipos genéricos) que no pasan por esta regla.
message DerivarExpedienteRequest {
  string id = 1;
  string area_destino = 2;
}

message DerivarExpedienteResponse {
  Expediente expediente = 1;
}

// Etapa 4: cierre real de F2 (CERTIFICADO/CONSTANCIA) y F4 (PERMISO/
// JUSTIFICACION_FALTA/JUSTIFICACION_TARDANZA) — ver
// docs/etapa-4-resolucion-cierre-f2-f4.md.

// RechazarExpediente: exclusivo de F4. Lo ejecuta quien tiene actualmente
// el expediente (DIRECTOR o SUBDIRECTOR) para devolverlo a SECRETARIA con
// estado OBSERVADO, para que el solicitante corrija.
message RechazarExpedienteRequest {
  string id = 1;
  string motivo = 2;
}

message RechazarExpedienteResponse {
  Expediente expediente = 1;
}

// CorregirExpediente: exclusivo del propio solicitante, sobre su propio
// expediente en estado OBSERVADO. Actualiza la descripción (la corrección)
// y reingresa a la revisión de Secretaría (vuelve a PENDIENTE).
message CorregirExpedienteRequest {
  string id = 1;
  string descripcion = 2;
}

message CorregirExpedienteResponse {
  Expediente expediente = 1;
}

// ResolverExpediente: exclusivo de F2, lo ejecuta Secretaría cuando ya
// tiene el documento final (verificado por el Gateway contra Documentos
// Service antes de llamar acá) y cierra el expediente como ATENDIDO.
message ResolverExpedienteRequest {
  string id = 1;
}

message ResolverExpedienteResponse {
  Expediente expediente = 1;
}

// ValidateDerivacion (Paso 20B.2): RPC de SOLO LECTURA, sin ningún efecto
// secundario — expone las mismas reglas reales que ya usa DerivarExpediente
// (estados.IsValidArea + estados.CanDerivar, sobre el Tipo/AreaActual REAL
// del expediente, nunca datos enviados por el cliente) para que otro
// microservicio (Derivaciones) pueda validar una transición SIN ejecutarla.
// No mueve area_actual, no cambia estado, no crea nada.
message ValidateDerivacionRequest {
  string expediente_id = 1;
  string area_destino = 2;
}

message ValidateDerivacionResponse {
  bool valido = 1;
}

service Expedientes {
  rpc CreateExpediente(CreateExpedienteRequest) returns (CreateExpedienteResponse);
  rpc GetExpediente(GetExpedienteRequest) returns (GetExpedienteResponse);
  rpc ListExpedientes(ListExpedientesRequest) returns (ListExpedientesResponse);
  rpc UpdateExpediente(UpdateExpedienteRequest) returns (UpdateExpedienteResponse);
  rpc ChangeEstado(ChangeEstadoRequest) returns (ChangeEstadoResponse);
  rpc DeleteExpediente(DeleteExpedienteRequest) returns (DeleteExpedienteResponse);
  rpc UpdateArea(UpdateAreaRequest) returns (UpdateAreaResponse);
  rpc DerivarExpediente(DerivarExpedienteRequest) returns (DerivarExpedienteResponse);
  rpc RechazarExpediente(RechazarExpedienteRequest) returns (RechazarExpedienteResponse);
  rpc CorregirExpediente(CorregirExpedienteRequest) returns (CorregirExpedienteResponse);
  rpc ResolverExpediente(ResolverExpedienteRequest) returns (ResolverExpedienteResponse);
  rpc ValidateDerivacion(ValidateDerivacionRequest) returns (ValidateDerivacionResponse);
}
