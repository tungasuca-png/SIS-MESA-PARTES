syntax = "proto3";

package expedientes;
option go_package="./expedientes";

message Expediente {
  string id = 1;
  string codigo = 2;
  string tipo = 3;
  string asunto = 4;
  string descripcion = 5;
  string solicitante_id = 6;
  string estado = 7;
  string prioridad = 8;
  string fecha_registro = 9;
  string fecha_actualizacion = 10;
  bool activo = 11;
}

message CreateExpedienteRequest {
  string tipo = 1;
  string asunto = 2;
  string descripcion = 3;
  string prioridad = 4;
}

message CreateExpedienteResponse {
  Expediente expediente = 1;
}

message GetExpedienteRequest {
  // Acepta el UUID interno o el codigo legible (EXP-2026-000001).
  string id = 1;
}

message GetExpedienteResponse {
  Expediente expediente = 1;
}

message ListExpedientesRequest {
  string estado = 1;
  string prioridad = 2;
  string tipo = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListExpedientesResponse {
  repeated Expediente expedientes = 1;
  int32 total = 2;
}

message UpdateExpedienteRequest {
  string id = 1;
  string asunto = 2;
  string descripcion = 3;
  string prioridad = 4;
}

message UpdateExpedienteResponse {
  Expediente expediente = 1;
}

message ChangeEstadoRequest {
  string id = 1;
  string nuevo_estado = 2;
}

message ChangeEstadoResponse {
  Expediente expediente = 1;
}

message DeleteExpedienteRequest {
  string id = 1;
}

message DeleteExpedienteResponse {
  bool success = 1;
}

service Expedientes {
  rpc CreateExpediente(CreateExpedienteRequest) returns (CreateExpedienteResponse);
  rpc GetExpediente(GetExpedienteRequest) returns (GetExpedienteResponse);
  rpc ListExpedientes(ListExpedientesRequest) returns (ListExpedientesResponse);
  rpc UpdateExpediente(UpdateExpedienteRequest) returns (UpdateExpedienteResponse);
  rpc ChangeEstado(ChangeEstadoRequest) returns (ChangeEstadoResponse);
  rpc DeleteExpediente(DeleteExpedienteRequest) returns (DeleteExpedienteResponse);
}
