Name: documentos.rpc
ListenOn: 0.0.0.0:8084
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: documentos.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: documentos_user
  Password: documentos_password
  Database: documentos_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

ExpedientesRpc:
  Target: 127.0.0.1:8082
