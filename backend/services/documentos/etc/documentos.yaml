Name: documentos.rpc
ListenOn: 127.0.0.1:8084
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: documentos.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: documentos_user
  Password: ${DOCUMENTOS_DB_PASSWORD}
  Database: documentos_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}

AuthRpc:
  Target: 127.0.0.1:8080

ExpedientesRpc:
  Target: 127.0.0.1:8082

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /documentos.Documentos/UploadDocumento
      - /documentos.Documentos/GetDocumento
      - /documentos.Documentos/DownloadDocumento
      - /documentos.Documentos/ListDocumentos
      - /documentos.Documentos/DeleteDocumento
