Name: auth.rpc
ListenOn: 127.0.0.1:8080
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: auth.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: auth_app
  Password: ${AUTH_DB_PASSWORD}
  Database: auth_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}
AccessTokenDuration: 15m
RefreshTokenDuration: 168h

# Sistemas consumidores (client credentials): clave PROPIA, distinta de
# JWT_SECRET, compartida solo con Estudiantes. Sin ella, la emisión de tokens
# de servicio queda deshabilitada (el login de usuarios no cambia).
ServiceJWTSecret: ${SERVICE_JWT_SECRET}
ServiceTokenIssuer: tungasuca-auth
ServiceTokenAudience: estudiantes
ServiceTokenDuration: 5m

# Acceso con Google (solo SOLICITANTES). Valores en backend/.env; sin ellos el
# acceso con Google responde "no configurado" y el login por DNI no cambia.
Google:
  ClientID: "${GOOGLE_CLIENT_ID}"
  ClientSecret: "${GOOGLE_CLIENT_SECRET}"
  RedirectURL: "${GOOGLE_REDIRECT_URL}"
  Issuer: "${GOOGLE_OIDC_ISSUER}"

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /auth.Auth/Register
      - /auth.Auth/Login
      - /auth.Auth/RefreshToken
      - /auth.Auth/CreateUser
      - /auth.Auth/Logout
      - /auth.Auth/ValidateToken
      # Client credentials: secreto de cliente en la solicitud o en la respuesta.
      - /auth.Auth/IssueServiceToken
      - /auth.Auth/CreateServiceClient
      - /auth.Auth/RevokeServiceClient
      - /auth.Auth/ListServiceClients
      # Google: códigos de autorización, verificadores PKCE, códigos de un
      # solo uso y tokens en la solicitud o en la respuesta.
      - /auth.Auth/GoogleStart
      - /auth.Auth/GoogleCallback
      - /auth.Auth/GoogleExchange
      - /auth.Auth/GoogleRegister
      - /auth.Auth/GoogleCompleteRegistration
      - /auth.Auth/GoogleCancelRegistration
      - /auth.Auth/GoogleStartLink
      - /auth.Auth/GoogleLinkStatus
