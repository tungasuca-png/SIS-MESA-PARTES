Name: auth.rpc
ListenOn: 127.0.0.1:8080
Mode: dev

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: auth.rpc

Postgres:
  Host: 127.0.0.1
  Port: 5433
  User: auth_app
  Password: ${AUTH_DB_PASSWORD}
  Database: auth_db
  SSLMode: disable

JWTSecret: ${JWT_SECRET}
AccessTokenDuration: 15m
RefreshTokenDuration: 168h

# Sistemas consumidores (client credentials): clave PROPIA, distinta de
# JWT_SECRET, compartida solo con Estudiantes. Sin ella, la emisión de tokens
# de servicio queda deshabilitada (el login de usuarios no cambia).
ServiceJWTSecret: ${SERVICE_JWT_SECRET}
ServiceTokenIssuer: tungasuca-auth
ServiceTokenAudience: estudiantes
ServiceTokenDuration: 5m
# A + B: audiencia derivaciones (publicador de Expedientes). Secreto EXCLUSIVO
# de esa audiencia, distinto de SERVICE_JWT_SECRET y de JWT_SECRET; solo en
# backend/.env. Vacío = audiencia derivaciones deshabilitada.
ServiceJWTSecretDerivaciones: "${SERVICE_JWT_SECRET_DERIVACIONES}"

# Acceso con Google (solo SOLICITANTES). Valores en backend/.env; sin ellos el
# acceso con Google responde "no configurado" y el login por DNI no cambia.
Google:
  ClientID: "${GOOGLE_CLIENT_ID}"
  ClientSecret: "${GOOGLE_CLIENT_SECRET}"
  RedirectURL: "${GOOGLE_REDIRECT_URL}"
  Issuer: "${GOOGLE_OIDC_ISSUER}"

# Registro manual de SOLICITANTES con verificación del correo. Sin
# SMTP_SERVIDOR y SMTP_REMITENTE el registro manual responde "no disponible";
# el login y Google no cambian. Credenciales solo en backend/.env.
RegistroCorreo:
  DuracionCodigo: 10m
  MaxIntentos: 5
  EsperaReenvio: 60s
  MaxEnvios: 5
  MaxRegistrosPorHora: 5
  SMTP:
    Servidor: "${SMTP_SERVIDOR}"
    Usuario: "${SMTP_USUARIO}"
    Clave: "${SMTP_CLAVE}"
    Remitente: "${SMTP_REMITENTE}"
    NombreRemitente: "${SMTP_NOMBRE_REMITENTE}"
    Seguridad: "${SMTP_SEGURIDAD}"

Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /auth.Auth/Register
      - /auth.Auth/Login
      - /auth.Auth/RefreshToken
      - /auth.Auth/CreateUser
      - /auth.Auth/Logout
      - /auth.Auth/ValidateToken
      # Client credentials: secreto de cliente en la solicitud o en la respuesta.
      - /auth.Auth/IssueServiceToken
      - /auth.Auth/CreateServiceClient
      - /auth.Auth/RevokeServiceClient
      - /auth.Auth/ListServiceClients
      # Google: códigos de autorización, verificadores PKCE, códigos de un
      # solo uso y tokens en la solicitud o en la respuesta.
      - /auth.Auth/GoogleStart
      - /auth.Auth/GoogleCallback
      - /auth.Auth/GoogleExchange
      - /auth.Auth/GoogleRegister
      - /auth.Auth/GoogleCompleteRegistration
      - /auth.Auth/GoogleCancelRegistration
      - /auth.Auth/GoogleStartLink
      - /auth.Auth/GoogleLinkStatus
      # Registro manual: clave, DNI, datos personales, códigos de
      # verificación y tokens en la solicitud o en la respuesta.
      - /auth.Auth/EmailRegister
      - /auth.Auth/EmailResendCode
      - /auth.Auth/EmailVerify
      - /auth.Auth/EmailCompleteRegistration
      - /auth.Auth/EmailCancelRegistration
      # Identidad de solicitantes: DNI declarado en la respuesta.
      - /auth.Auth/ListSolicitanteIdentities
      - /auth.Auth/GetSolicitanteIdentity
      - /auth.Auth/VerifySolicitanteIdentity
      - /auth.Auth/RejectSolicitanteIdentity
      - /auth.Auth/ConfirmSolicitanteIdentitySync
      - /auth.Auth/RecordSolicitanteIdentitySyncFailure
      - /auth.Auth/RevertSolicitanteIdentity
