syntax = "proto3";

package auth;
option go_package="./auth";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4;
  // DNI (8 dígitos): credencial de ingreso junto con la contraseña.
  string dni = 5;
}

message RegisterResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string message = 5;
}

message LoginRequest {
  // DNI (8 dígitos): identifica al usuario; reemplaza al username como credencial.
  string dni = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string user_id = 4;
  string username = 5;
  string email = 6;
  string role = 7;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
  string role = 4;
}

message HasPermissionRequest {
  string user_id = 1;
  string permission = 2;
}

message HasPermissionResponse {
  bool allowed = 1;
}

// GetMyPermissions: lista COMPLETA de permisos efectivos del usuario
// AUTENTICADO (union de todos sus roles reales) — self-only, sin user_id
// en el request, mismo criterio de identidad ya usado por HasPermission/
// Logout/UpdateMyProfile (Usuarios Service): la identidad sale
// exclusivamente del JWT/contexto, nunca de un campo del cliente.
// Reutiliza AuthorizationService.GetPermissionsByUserID (ya existente,
// ya usado internamente por HasPermission) — no hay una segunda
// implementación del cálculo de permisos.
message GetMyPermissionsRequest {
}

message GetMyPermissionsResponse {
  repeated string permissions = 1;
}

// Paso 21B: capa de SOLO LECTURA del catálogo de roles/permisos, para la
// futura configuración administrativa (Paso 21A confirmó que no existía
// ningún RPC de lectura ni de escritura sobre roles/permissions/
// role_permissions). Fuente de datos: las mismas tablas reales, vía los
// repositorios ya existentes (RoleRepository/PermissionRepository/
// RolePermissionRepository) — ningún catálogo paralelo en Go.

message Role {
  string id = 1;
  string nombre = 2;
  string descripcion = 3;
  bool estado = 4;
}

message ListRolesRequest {
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message Permission {
  string id = 1;
  string codigo = 2;
  string nombre = 3;
  string descripcion = 4;
  string modulo = 5;
  bool estado = 6;
}

message ListPermissionsRequest {
}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

// GetRolePermissions: el acceso se identifica por role_id real (nunca por
// role_name ni por una lista de permission_ids enviada por el cliente) —
// la fuente de verdad de qué permisos tiene un rol sigue siendo
// exclusivamente la tabla role_permissions.
message GetRolePermissionsRequest {
  string role_id = 1;
}

message GetRolePermissionsResponse {
  repeated Permission permissions = 1;
}

// UpdateRolePermissions (Paso 21C): reemplaza el conjunto COMPLETO de
// permisos de un rol (no "agrega") — permission_ids representa el estado
// FINAL deseado. role_id y cada permission_id se validan contra las tablas
// reales (roles/permissions); ninguno se acepta ciegamente.
message UpdateRolePermissionsRequest {
  string role_id = 1;
  repeated string permission_ids = 2;
}

message UpdateRolePermissionsResponse {
  string role_id = 1;
  repeated string permission_ids = 2;
}

// UpdateUserRole: reemplaza el ÚNICO rol de un usuario ya existente
// (Usuario -> Rol, distinto de Rol -> Permisos de arriba). El sistema
// trabaja con la regla "1 usuario = 1 rol": esto NUNCA agrega un rol
// adicional, siempre reemplaza el que el usuario tenía (transaccional:
// DELETE del rol anterior + INSERT del nuevo, o ninguno de los dos).
message UpdateUserRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message UpdateUserRoleResponse {
  string user_id = 1;
  string role_id = 2;
  string role_nombre = 3;
}

// CreateUser (administrativo, distinto de Register): a diferencia de
// Register (público, self-service, solo permite SOLICITANTE), esta
// operación la ejecuta un actor con "usuarios.change_role" y puede asignar
// cualquier rol real activo mediante role_id (nunca un nombre de rol
// enviado directo, y nunca confiando en el frontend para decidir si el rol
// existe/está activo). Sigue siendo "1 usuario = 1 rol": crea exactamente
// una fila en usuario_roles, igual que Register.
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role_id = 4;
  string dni = 5;
}

message CreateUserResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string role_id = 4;
  string role_nombre = 5;
}

// Sistemas consumidores (client credentials). Un sistema externo cambia su
// client_id + client_secret por un JWT de servicio de corta duración,
// firmado con una clave distinta de la de usuarios (ServiceJWTSecret) y con
// iss/aud/token_type/scope. Nunca representa a un usuario ni lleva rol.
message IssueServiceTokenRequest {
  string client_id = 1;
  string client_secret = 2;
}

message IssueServiceTokenResponse {
  string access_token = 1;
  int64 expires_in = 2;
  // Permisos autorizados, separados por espacios (claim "scope").
  string scope = 3;
}

message ServiceClient {
  string id = 1;
  string nombre = 2;
  string client_id = 3;
  string estado = 4;
  repeated string permisos = 5;
  string created_at = 6;
  string last_used_at = 7;
  string revoked_at = 8;
}

// Alta administrativa ("integraciones.manage"): client_secret se devuelve
// UNA sola vez; Auth guarda solo su hash.
message CreateServiceClientRequest {
  string nombre = 1;
  repeated string permisos = 2;
}

message CreateServiceClientResponse {
  ServiceClient client = 1;
  string client_secret = 2;
}

// Revocación: acepta el id (UUID) o el client_id.
message RevokeServiceClientRequest {
  string id = 1;
}

message RevokeServiceClientResponse {
  ServiceClient client = 1;
}

message ListServiceClientsRequest {}

message ListServiceClientsResponse {
  repeated ServiceClient clients = 1;
}

service Auth {
  rpc Ping(Request) returns(Response);
  rpc Register(RegisterRequest) returns(RegisterResponse);
  rpc Login(LoginRequest) returns(LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns(LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns(ValidateTokenResponse);
  rpc HasPermission(HasPermissionRequest) returns(HasPermissionResponse);
  rpc GetMyPermissions(GetMyPermissionsRequest) returns(GetMyPermissionsResponse);
  rpc ListRoles(ListRolesRequest) returns(ListRolesResponse);
  rpc ListPermissions(ListPermissionsRequest) returns(ListPermissionsResponse);
  rpc GetRolePermissions(GetRolePermissionsRequest) returns(GetRolePermissionsResponse);
  rpc UpdateRolePermissions(UpdateRolePermissionsRequest) returns(UpdateRolePermissionsResponse);
  rpc UpdateUserRole(UpdateUserRoleRequest) returns(UpdateUserRoleResponse);
  rpc CreateUser(CreateUserRequest) returns(CreateUserResponse);
  rpc IssueServiceToken(IssueServiceTokenRequest) returns(IssueServiceTokenResponse);
  rpc CreateServiceClient(CreateServiceClientRequest) returns(CreateServiceClientResponse);
  rpc RevokeServiceClient(RevokeServiceClientRequest) returns(RevokeServiceClientResponse);
  rpc ListServiceClients(ListServiceClientsRequest) returns(ListServiceClientsResponse);
}
