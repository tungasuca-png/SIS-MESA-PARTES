Name: gateway-api
Host: 127.0.0.1
Port: 8888

AuthRpc:
  Target: 127.0.0.1:8080

ExpedientesRpc:
  Target: 127.0.0.1:8082
  # A + B: por debajo del timeout REST (3000 ms) y del servidor de Expedientes (3000 ms).
  Timeout: 2500

UsuariosRpc:
  Target: 127.0.0.1:8083

DocumentosRpc:
  Target: 127.0.0.1:8084

DerivacionesRpc:
  Target: 127.0.0.1:8085

PsicologiaRpc:
  Target: 127.0.0.1:8086

EstudiantesRpc:
  Target: 127.0.0.1:8087

# El LogHandler estándar de go-zero, ante un 5xx, vuelca el request completo
# (cabeceras incluida Authorization y primer KB del cuerpo). Se desactiva y lo
# reemplaza logsafe.AccessLog (método, ruta, código y duración; nada más).
# Ver internal/logsafe. El contenido de las llamadas gRPC sensibles se oculta por
# método en logsafe.ProtectSensitiveRPCLogs (se conservan los errores).
Middlewares:
  Log: false

# Acceso con Google (solo SOLICITANTES). Valores en backend/.env:
# GOOGLE_COOKIE_SECURE=true en producción (HTTPS); FRONTEND_URL vacío = mismo
# origen que el Gateway (proxy de Vite en desarrollo).
GoogleCookieSegura: "${GOOGLE_COOKIE_SECURE}"
FrontendURL: "${FRONTEND_URL}"
